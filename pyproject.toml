[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartroute"
version = "0.1.0"
description = "Privacy-constrained contextual-bandit router for hybrid local and cloud LLMs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<47",
  "PyJWT>=2.9,<3",
  "email-validator>=2.2,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pypdf>=5.1,<6",
  "rank-bm25>=0.2,<1",
  "python-multipart>=0.0.17,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "pytest-asyncio>=0.24,<2",
  "import-linter>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Concrete adapters are only imported inside gateway/ (single egress)"
type = "forbidden"
source_modules = [
  "app.auth", "app.keys", "app.registry", "app.documents", "app.privacy", "app.context",
  "app.routing", "app.feedback", "app.analytics", "app.admin", "app.db", "app.core", "app.main",
]
forbidden_modules = ["app.adapters"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Adapters know nothing about the database, routing or privacy"
type = "forbidden"
source_modules = ["app.adapters"]
forbidden_modules = ["app.db", "app.routing", "app.privacy", "app.gateway"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Privacy knows nothing about routing or the gateway"
type = "forbidden"
source_modules = ["app.privacy"]
forbidden_modules = ["app.routing", "app.gateway"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Routing does not import adapters or the gateway"
type = "forbidden"
source_modules = ["app.routing"]
forbidden_modules = ["app.adapters", "app.gateway"]
allow_indirect_imports = true
