name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check backend scripts eval
      - run: lint-imports
      - run: python -m alembic upgrade head && python -m alembic check
        env:
          DATABASE_URL: sqlite:///./ci_migration.db
      - run: python -m pytest
        env:
          FAKE_PROVIDERS: "true"

  privacy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m eval.privacy_suite
      - run: python -m pytest backend/tests/test_privacy.py backend/tests/test_phase5_api.py -q
        env:
          FAKE_PROVIDERS: "true"

  eval-smoke:
    runs-on: ubuntu-latest
    needs: privacy-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m eval.build_dataset --name smoke-10 --scale 0.05
          python -m eval.oracle --dataset smoke-10 --limit 10
          python -m eval.train_frozen --dataset smoke-10
          python -m eval.run_baselines --dataset smoke-10 --limit 10 --seeds 0 --cold

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
